name: Verify deployment container

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to verify, for example sha-abc1234
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deployment-container-verification
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/javadeslamibabaheidari/assetflow-inventory-api

jobs:
  verify-container:
    name: Run published service in GitHub Actions
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image tag
        id: image
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.image_tag }}"
          else
            tag="sha-${SOURCE_SHA:0:7}"
          fi
          [[ "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || {
            echo "image_tag contains unsupported characters" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image
        run: docker pull "$IMAGE:${{ steps.image.outputs.tag }}"

      - name: Run service container
        run: |
          docker run \
            --detach \
            --name inventory-api \
            --publish 8080:8080 \
            --env ASPNETCORE_URLS=http://+:8080 \
            "$IMAGE:${{ steps.image.outputs.tag }}"

      - name: Wait for health endpoint
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://localhost:8080/health; then
              exit 0
            fi
            docker logs inventory-api
            sleep 2
          done
          echo "Service did not become healthy in time" >&2
          docker logs inventory-api
          exit 1

      - name: Stop service container
        if: always()
        run: docker rm --force inventory-api || true
