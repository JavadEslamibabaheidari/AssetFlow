name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MarketplaceInventoryPlatform.sln

      - name: Build
        run: dotnet build MarketplaceInventoryPlatform.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test MarketplaceInventoryPlatform.sln --configuration Release --no-build

      - name: Smoke test API
        shell: bash
        run: |
          dotnet publish src/Inventory.Api/Inventory.Api.csproj --configuration Release --no-build --output ./publish
          ASPNETCORE_URLS=http://127.0.0.1:8080 dotnet ./publish/Inventory.Api.dll &
          api_pid=$!

          cleanup() {
            kill "$api_pid" || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health > /tmp/assetflow-health.json; then
              break
            fi

            if ! kill -0 "$api_pid" 2>/dev/null; then
              echo "API process exited before becoming healthy"
              exit 1
            fi

            sleep 1
          done

          curl --fail --silent http://127.0.0.1:8080/ | tee /tmp/assetflow-root.json
          grep -q "Marketplace inventory platform is running." /tmp/assetflow-root.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: src/AssetFlow.Web
        run: npm install

      - name: Check frontend formatting
        working-directory: src/AssetFlow.Web
        run: npm run format:check

      - name: Lint frontend
        working-directory: src/AssetFlow.Web
        run: npm run lint

      - name: Type-check frontend
        working-directory: src/AssetFlow.Web
        run: npm run typecheck

      - name: Test frontend
        working-directory: src/AssetFlow.Web
        run: npm run test

      - name: Build frontend
        working-directory: src/AssetFlow.Web
        run: npm run build

      - name: Install Playwright browser
        working-directory: src/AssetFlow.Web
        run: npx playwright install --with-deps chromium

      - name: Smoke test frontend
        working-directory: src/AssetFlow.Web
        run: npm run test:e2e -- --project=chromium

      - name: Docker Compose build
        run: docker compose build

      - name: Docker Compose smoke test
        shell: bash
        run: |
          set -euo pipefail

          docker compose up -d

          cleanup() {
            docker compose down
          }
          trap cleanup EXIT

          wait_for_url() {
            local url="$1"

            for attempt in {1..30}; do
              if curl --fail --silent "$url" > /dev/null; then
                return 0
              fi

              sleep 1
            done

            curl --fail --silent "$url" > /dev/null
          }

          wait_for_url http://127.0.0.1:8080/health
          wait_for_url http://127.0.0.1:5173/health

          if ! curl --fail --silent http://127.0.0.1:8080/health > /tmp/assetflow-compose-api-health.json; then
            docker compose logs inventory-api
            exit 1
          fi

          if ! curl --fail --silent http://127.0.0.1:5173/health > /tmp/assetflow-compose-web-health.txt; then
            docker compose logs assetflow-web
            exit 1
          fi

          if ! curl --fail --silent http://127.0.0.1:5173/ | grep -q "AssetFlow"; then
            docker compose logs assetflow-web
            exit 1
          fi

      - name: Docker build
        run: docker build -t inventory-api:ci .

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: docker-meta
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/javadeslamibabaheidari/assetflow-inventory-api
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
