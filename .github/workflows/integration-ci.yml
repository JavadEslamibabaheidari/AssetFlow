name: Integration CI

on:
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "contracts/openapi/**"
      - ".github/workflows/**"
      - "README.md"
      - "docs/**"
      - "src/Inventory.Api/**"
      - "src/AssetFlow.Web/**"
  pull_request:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "contracts/openapi/**"
      - ".github/workflows/**"
      - "README.md"
      - "docs/**"
      - "src/Inventory.Api/**"
      - "src/AssetFlow.Web/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    name: Docker Compose integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Compose build
        run: docker compose build

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: src/AssetFlow.Web
        run: npm install

      - name: Install Playwright browser
        working-directory: src/AssetFlow.Web
        run: npx playwright install --with-deps chromium

      - name: Docker Compose smoke test
        shell: bash
        env:
          PLAYWRIGHT_REUSE_SERVER: "true"
        run: |
          set -euo pipefail

          docker compose up -d

          cleanup() {
            docker compose down
          }
          trap cleanup EXIT

          wait_for_url() {
            local url="$1"

            for attempt in {1..30}; do
              if curl --fail --silent "$url" > /dev/null; then
                return 0
              fi

              sleep 1
            done

            curl --fail --silent "$url" > /dev/null
          }

          wait_for_url http://127.0.0.1:8080/health
          wait_for_url http://127.0.0.1:5173/health

          if ! curl --fail --silent http://127.0.0.1:8080/health > /tmp/assetflow-compose-api-health.json; then
            docker compose logs inventory-api
            exit 1
          fi

          if ! curl --fail --silent http://127.0.0.1:5173/health > /tmp/assetflow-compose-web-health.txt; then
            docker compose logs assetflow-web
            exit 1
          fi

          if ! curl --fail --silent http://127.0.0.1:5173/ | grep -q "AssetFlow"; then
            docker compose logs assetflow-web
            exit 1
          fi

          npm --prefix src/AssetFlow.Web run test:e2e -- --project=chromium --grep @backend
