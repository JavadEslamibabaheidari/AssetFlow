services:
  inventory-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080

  assetflow-web:
    build:
      context: ./src/AssetFlow.Web
      dockerfile: Dockerfile
      args:
        VITE_ASSETFLOW_API_BASE_URL: http://localhost:8080
    depends_on:
      - inventory-api
    ports:
      - "${ASSETFLOW_WEB_PORT:-5173}:8080"

  prometheus:
    image: prom/prometheus:v3.0.1
    profiles:
      - monitoring
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - inventory-api
    ports:
      - "${ASSETFLOW_PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.4.0
    profiles:
      - monitoring
    environment:
      GF_SECURITY_ADMIN_USER: assetflow
      GF_SECURITY_ADMIN_PASSWORD: assetflow
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    ports:
      - "${ASSETFLOW_GRAFANA_PORT:-3000}:3000"
