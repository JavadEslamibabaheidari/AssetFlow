services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: assetflow_inventory
      POSTGRES_USER: assetflow
      POSTGRES_PASSWORD: assetflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetflow -d assetflow_inventory"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - assetflow-postgres-data:/var/lib/postgresql/data

  inventory-api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__InventoryDb: Host=postgres;Port=5432;Database=assetflow_inventory;Username=assetflow;Password=assetflow
      AssetFlow__ApplyDatabaseMigrations: "true"

  assetflow-web:
    build:
      context: ./src/AssetFlow.Web
      dockerfile: Dockerfile
      args:
        VITE_ASSETFLOW_API_BASE_URL: http://localhost:8080
    depends_on:
      - inventory-api
    ports:
      - "${ASSETFLOW_WEB_PORT:-5173}:8080"

  prometheus:
    image: prom/prometheus:v3.0.1
    profiles:
      - monitoring
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - inventory-api
    ports:
      - "${ASSETFLOW_PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.4.0
    profiles:
      - monitoring
    environment:
      GF_SECURITY_ADMIN_USER: assetflow
      GF_SECURITY_ADMIN_PASSWORD: assetflow
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    ports:
      - "${ASSETFLOW_GRAFANA_PORT:-3000}:3000"

volumes:
  assetflow-postgres-data:
